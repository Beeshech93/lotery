<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOTO509 POS - Previzyalizasyon Kòt a Kòt / Aperçu Côte à Côte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Outfit', sans-serif;
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #0f172a;
      border-bottom: 1px solid #334155;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .title-group h1 {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }
    .title-group p {
      font-size: 11px;
      color: #94a3b8;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .device-btn {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #cbd5e1;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .device-btn:hover {
      background: #273549;
      color: #fff;
    }
    .device-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
    }
    .btn-external {
      background: #10b981;
      border: none;
      color: #fff;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .btn-external:hover {
      background: #059669;
    }
    main {
      flex: 1;
      background: #040711;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      position: relative;
    }
    .frame-container {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }
    .frame-container.pos-handheld {
      width: 412px;
      height: 90vh;
      border-radius: 28px;
      border: 8px solid #334155;
    }
    .frame-container.pos-tablet {
      width: 800px;
      height: 90vh;
    }
    .frame-container.pos-desktop {
      width: 100%;
      height: 100%;
      border-radius: 8px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #090d16;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="logo-badge">🎟️</div>
      <div class="title-group">
        <h1>LOTO509 POS</h1>
        <p>New York • Florida • Georgia</p>
      </div>
    </div>

    <div class="controls">
      <button class="device-btn active" onclick="setDevice('desktop', this)">🖥️ Caisse Large</button>
      <button class="device-btn" onclick="setDevice('tablet', this)">📟 Tablette POS</button>
      <button class="device-btn" onclick="setDevice('handheld', this)">📱 Sunmi / Handheld</button>
      <button class="device-btn" onclick="loadReceipt(this)">🧾 Tikè Tèmik</button>
      <a href="http://localhost:5173" target="_blank" class="btn-external">Ouvri Deyò ↗</a>
    </div>
  </header>

  <main>
    <div id="frameWrapper" class="frame-container pos-desktop">
      <iframe id="posFrame" src="http://localhost:5173"></iframe>
    </div>
  </main>

  <script>
    const frameWrapper = document.getElementById('frameWrapper');
    const posFrame = document.getElementById('posFrame');

    function setDevice(type, btn) {
      document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      frameWrapper.className = 'frame-container pos-' + type;
    }

    function loadReceipt(btn) {
      document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      frameWrapper.className = 'frame-container pos-handheld';
      posFrame.src = 'http://localhost:5173/?receipt=TK-20261021-0002';
    }
  </script>
</body>
</html>
